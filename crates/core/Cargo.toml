[package]
name = "reviewgate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
homepage.workspace = true
keywords = ["code-review", "ai", "llm", "ci", "quality-gate"]
categories = ["development-tools"]

[lib]
name = "reviewgate_core"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
toml.workspace = true
globset = "0.4.18"
tree-sitter = "0.26.9"
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[features]
default = ["rust", "cpp", "python", "go", "java", "javascript", "typescript"]
rust = ["tree-sitter-rust"]
cpp = ["tree-sitter-cpp"]
python = ["tree-sitter-python"]
go = ["tree-sitter-go"]
java = ["tree-sitter-java"]
javascript = ["tree-sitter-javascript"]
typescript = ["tree-sitter-typescript"]

[dev-dependencies]
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
serde_json.workspace = true
http = "1"
